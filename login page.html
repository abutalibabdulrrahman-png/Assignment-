<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <!--TailWind CSS-->
    <script
    src="https://cdn.tailwindcss.com"></script>

    <!-- Front Awesome Icons -->
     <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-yellow-400 flex items-center justify-center min-h-screen">

    <div class="relative bg-white rounded-x1 shadow-x1 w-96 p-10">
        <!-- TOP ICON -->
         <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-20 h-20 bg-gray-800 rounded-full flex items-center justify-center">
            <i class="fa-regular fa-envelope text-white text-3xl"></i>
            </div>

            <div class="mt-10">
                <!-- USERNAME -->
                 <div class="flex items-center bg-gray-100 rounded-md mb-5 px-4 py-3">
                    <i class="fa-solid fa-user text-gray-500 mr-3"></i>
                    <input type="text"
                    placeholder="Username"
                    autofocus
                    class="bg-transparent outline-none w-full">
                 </div>
                 <!-- PASSWORD -->
                  <div class="flex items-center bg-gray-100 rounded-md mb-5 px-4 py-3">
                    <i class="fa-solid fa-lock text-gray-500 mr-3"></i>
                    <input type="password"
                    placeholder="Password"
                    class="w-full bg-gray-100 p-3 rounded-md outline-none">
                  </div>
                  <!-- LOGIN BUTTON -->
                   <button class="w-full bg-gray-800 text-white py-3 rounded-md hover:bg-black transition">
                    LOGIN
                   </button>
                </div>

            </div>
            
</body>
</html>
